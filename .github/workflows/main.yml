name: Build VST3 (Windows)

 

on:

  push:

  workflow_dispatch:

 

jobs:

  build:

    runs-on: windows-2022

    steps:

      - uses: actions/checkout@v4

 

      - name: Configure

        run: cmake -S . -B build

 

      - name: Build

        run: cmake --build build --config Release --parallel

 

      - name: Collect plug-in

        shell: pwsh

        run: |

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item -Recurse -Force "build/VocalForge_artefacts/Release/VST3/*" dist/

 

      - uses: actions/upload-artifact@v4

        with:

          name: VocalForge-VST3-Windows

          path: dist
